version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: newsroom_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: social_news_agents
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./server/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - newsroom_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: newsroom_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: social_news_agents
      DEFAULT_AI_PROVIDER: gemini
      GEMINI_MODEL: gemini-2.5-flash
      OPENAI_MODEL: gpt-4o-mini
      DAILY_AI_BUDGET: 15.00
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    networks:
      - newsroom_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: newsroom_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - newsroom_net

volumes:
  mysql_data:

networks:
  newsroom_net:
    driver: bridge
